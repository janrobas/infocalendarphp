# Apache 2.4 virtual host for the Infomaniak Calendar MCP server.
# The document root MUST be the `public_html/` directory.

<VirtualHost *:443>
    ServerName calendar.example.com

    DocumentRoot /path/to/infomaniak-mcp/public_html

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/calendar.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/calendar.example.com/privkey.pem

    # Forward the Authorization header to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /path/to/infomaniak-mcp/public_html>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp-access.log combined
</VirtualHost>
