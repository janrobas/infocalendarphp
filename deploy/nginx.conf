# Nginx server block for the Infomaniak Calendar MCP server.
# The document root MUST be the `public_html/` directory. Everything else
# (src/, vendor/, data/, .env) is outside the root and therefore unreachable.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calendar.example.com;

    ssl_certificate     /etc/letsencrypt/live/calendar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.example.com/privkey.pem;

    root /path/to/infomaniak-mcp/public_html;
    index index.php;

    # Route everything through the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Required for the MCP streamable HTTP transport (SSE).
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    # Block access to dotfiles.
    location ~ /\. {
        deny all;
    }
}
